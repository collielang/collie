name: CI (compiler)

on:
  push:
    branches: ["main"]
    paths:
      - 'compiler/**'
      - '.github/workflows/ci-compiler.yml'
  pull_request:
    paths:
      - 'compiler/**'
      - '.github/workflows/ci-compiler.yml'
  workflow_dispatch:

# 允许同一分支/PR 的新提交取消仍在排队/运行的旧任务，节省资源
concurrency:
  group: ci-compiler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (gcc)
            os: ubuntu-latest
          - name: Windows (MSVC)
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 缓存第三方源码（GoogleTest 的持久 .deps/），避免每次联网克隆
      - name: Cache third-party sources
        uses: actions/cache@v4
        with:
          path: compiler/.deps
          key: collie-deps-${{ runner.os }}-gtest-1.12.1

      - name: Configure
        run: cmake -S compiler -B compiler/build -DCMAKE_BUILD_TYPE=Release

      # 构建主程序与全部已绿色的测试集：lexer/parser/semantic/interpreter。
      # semantic_tests 已完成 t10 分诊：面向未实现特性的用例加 DISABLED_ 暂停，绿色子集入门禁。
      - name: Build
        run: cmake --build compiler/build --config Release --target collie lexer_tests parser_tests semantic_tests interpreter_tests

      # 单元测试门禁：四个测试集全绿；DISABLED_ 用例默认跳过（见 PROGRESS.md 的 t9/t10）
      - name: Test (unit tests)
        run: ctest --test-dir compiler/build -C Release -R "lexer_tests|parser_tests|semantic_tests|interpreter_tests" --output-on-failure

      # 命令行端到端门禁：正常程序应成功、语法错误应非零退出
      - name: Test (CLI gate)
        run: ctest --test-dir compiler/build -C Release -R "cli_valid_program|cli_syntax_error_gate" --output-on-failure
