name: CI (compiler)

on:
  push:
    branches: ["main"]
    paths:
      - 'compiler/**'
      - '.github/workflows/ci-compiler.yml'
  pull_request:
    paths:
      - 'compiler/**'
      - '.github/workflows/ci-compiler.yml'
  workflow_dispatch:

# 允许同一分支/PR 的新提交取消仍在排队/运行的旧任务，节省资源
concurrency:
  group: ci-compiler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (gcc)
            os: ubuntu-latest
          - name: Windows (MSVC)
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 缓存第三方源码（GoogleTest 的持久 .deps/），避免每次联网克隆
      - name: Cache third-party sources
        uses: actions/cache@v4
        with:
          path: compiler/.deps
          key: collie-deps-${{ runner.os }}-gtest-1.12.1

      - name: Configure
        run: cmake -S compiler -B compiler/build -DCMAKE_BUILD_TYPE=Release

      # 仅构建主程序与已绿色的测试集：lexer_tests、interpreter_tests。
      # parser_tests/semantic_tests 存在预存缺陷（见 PROGRESS.md 的 t9/t10），修复后再纳入 CI
      - name: Build
        run: cmake --build compiler/build --config Release --target collie lexer_tests interpreter_tests

      - name: Test (lexer_tests + interpreter_tests)
        run: ctest --test-dir compiler/build -C Release -R "lexer_tests|interpreter_tests" --output-on-failure
